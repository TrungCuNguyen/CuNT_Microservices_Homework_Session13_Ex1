services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-identity-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 17111998
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data

volumes:
  postgres_identity_data:

